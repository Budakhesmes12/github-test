<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f5f3ff">
	<title>Hello, World!ggg</title>
	<style>
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 1.5rem;
			background: linear-gradient(135deg, #eef2ff, #fdf2f8);
			color: #1e1b4b;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			text-align: center;
		}
		main {
			width: min(100%, 38rem);
			padding: clamp(2rem, 7vw, 4rem);
			border: 1px solid rgba(255, 255, 255, .8);
			border-radius: 1.5rem;
			background: rgba(255, 255, 255, .78);
			box-shadow: 0 1.5rem 4rem rgba(49, 46, 129, .12);
		}
		.eyebrow {
			margin: 0 0 .75rem;
			color: #7c3aed;
			font-size: .8rem;
			font-weight: 700;
			letter-spacing: .16em;
			text-transform: uppercase;
		}
		h1 { margin: 0; font-size: clamp(2.75rem, 10vw, 5rem); line-height: 1.05; }
		.message { margin: 1rem 0 0; color: #5b5875; font-size: 1.1rem; }
		button {
			margin-top: 2rem;
			padding: .8rem 1.3rem;
			border: 0;
			border-radius: 999px;
			background: #6d28d9;
			color: white;
			font: inherit;
			font-weight: 650;
			cursor: pointer;
		}
		button:hover { background: #5b21b6; }
		button:focus-visible { outline: 3px solid #c4b5fd; outline-offset: 3px; }
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">A little hello</p>
		<h1 id="greeting">Hello, world!</h1>
		<p class="message">Welcome to my website.</p>
		<button id="greet-button" type="button">Say hello</button>
	</main>
	<script>
		const button = document.getElementById('greet-button');
		button.addEventListener('click', () => {
			document.getElementById('greeting').textContent = 'Hello, you!';
			button.textContent = 'Hello!';
		});
	</script>
</body>
</html>
